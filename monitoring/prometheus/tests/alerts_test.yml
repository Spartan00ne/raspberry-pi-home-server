# Unit-Tests für die Alarmregeln, ausgeführt in der CI mit:
#   promtool test rules monitoring/prometheus/tests/alerts_test.yml
# Jeder Test spielt künstliche Messwerte ab und prüft, ob (und wann) ein Alarm
# mit genau diesen Labels und Texten auslöst.
rule_files:
  - ../rules/alerts.yml

evaluation_interval: 1m

tests:
  # Temperatur: erst nach 5 Minuten über 75 °C, nicht schon beim ersten Wert.
  - interval: 1m
    input_series:
      - series: 'node_thermal_zone_temp{type="cpu-thermal", zone="0"}'
        values: '76x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: PiTemperaturHoch
        exp_alerts: []
      - eval_time: 6m
        alertname: PiTemperaturHoch
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "CPU-Temperatur hoch: 76.0 °C"
              description: "Die CPU ist seit 5 Minuten über 75 °C. Ab 80 °C drosselt der Pi."
      - eval_time: 6m
        alertname: PiTemperaturKritisch
        exp_alerts: []

  # Website: fällt nach 2 Minuten aus, Alarm 3 Minuten später.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://koffler-online.de/", job="blackbox"}'
        values: '1 1 0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: WebsiteOffline
        exp_alerts: []
      - eval_time: 6m
        alertname: WebsiteOffline
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: https://koffler-online.de/
              job: blackbox
            exp_annotations:
              summary: "https://koffler-online.de/ ist nicht erreichbar"
              description: "Die Prüfung über das Internet schlägt seit 3 Minuten fehl. Tunnel und nginx prüfen."

  # Container: dashboard-api fehlt, alle anderen laufen.
  - interval: 1m
    input_series:
      - {series: 'container_last_seen{job="cadvisor", name="nginx-homepage"}', values: '1x5'}
      - {series: 'container_last_seen{job="cadvisor", name="cloudflared"}', values: '1x5'}
      - {series: 'container_last_seen{job="cadvisor", name="prometheus"}', values: '1x5'}
      - {series: 'container_last_seen{job="cadvisor", name="alertmanager"}', values: '1x5'}
      - {series: 'container_last_seen{job="cadvisor", name="grafana"}', values: '1x5'}
      - {series: 'container_last_seen{job="cadvisor", name="node-exporter"}', values: '1x5'}
      - {series: 'container_last_seen{job="cadvisor", name="blackbox-exporter"}', values: '1x5'}
    alert_rule_test:
      - eval_time: 3m
        alertname: ContainerAusgefallen
        exp_alerts:
          - exp_labels: {severity: critical, name: dashboard-api}
            exp_annotations:
              summary: "Container dashboard-api läuft nicht"
              description: "Prüfen mit: docker ps -a und docker logs dashboard-api"

  # Deployment: ein fehlgeschlagener Lauf alarmiert sofort.
  - interval: 1m
    input_series:
      - series: 'homepage_deploy_success{commit="abc1234", instance="raspberry-pi", job="node"}'
        values: '1 1 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: DeploymentFehlgeschlagen
        exp_alerts: []
      - eval_time: 3m
        alertname: DeploymentFehlgeschlagen
        exp_alerts:
          - exp_labels: {severity: warning, commit: abc1234, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Deployment von Commit abc1234 fehlgeschlagen"
              description: "Der Pi läuft weiter mit dem vorherigen Stand. Logs: journalctl -u homepage-deploy"

  # Deployment: Der Timer meldet sich nicht mehr (letzter Lauf bei t=0).
  - interval: 1m
    input_series:
      - series: 'homepage_deploy_last_run_timestamp_seconds{instance="raspberry-pi", job="node"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: DeploymentVeraltet
        exp_alerts: []
      - eval_time: 30m
        alertname: DeploymentVeraltet
        exp_alerts:
          - exp_labels: {severity: warning, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Automatisches Deployment läuft nicht"
              description: "homepage-deploy.timer hat seit über 15 Minuten nicht geprüft. Prüfen mit: systemctl status homepage-deploy.timer"

  # Backup: ein fehlgeschlagener Lauf alarmiert sofort.
  - interval: 1m
    input_series:
      - series: 'homepage_backup_success{instance="raspberry-pi", job="node"}'
        values: '1 1 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: BackupFehlgeschlagen
        exp_alerts: []
      - eval_time: 3m
        alertname: BackupFehlgeschlagen
        exp_alerts:
          - exp_labels: {severity: warning, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Backup fehlgeschlagen"
              description: "Der letzte Lauf von homepage-backup ist fehlgeschlagen. Logs: journalctl -u homepage-backup"

  # Backup: letzter Erfolg bei t=0. Nach 26 h wird es kritisch, nach einer
  # weiteren Stunde kommt der Alarm.
  - interval: 1m
    input_series:
      - series: 'homepage_backup_last_success_timestamp_seconds{instance="raspberry-pi", job="node"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 26h
        alertname: BackupVeraltet
        exp_alerts: []
      - eval_time: 27h30m
        alertname: BackupVeraltet
        exp_alerts:
          - exp_labels: {severity: warning, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Seit über 26 Stunden kein erfolgreiches Backup"
              description: "Prüfen mit: systemctl list-timers homepage-backup.timer und journalctl -u homepage-backup (docs/backup.md)"

  # Backup: Es gab noch nie ein erfolgreiches Backup (z. B. nach einem Neuaufbau).
  - interval: 1m
    input_series:
      - series: 'up{instance="raspberry-pi", job="node"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupVeraltet
        exp_alerts: []
      - eval_time: 61m
        alertname: BackupVeraltet
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Seit über 26 Stunden kein erfolgreiches Backup"
              description: "Prüfen mit: systemctl list-timers homepage-backup.timer und journalctl -u homepage-backup (docs/backup.md)"

  # Restore-Test: ein fehlgeschlagener Lauf alarmiert sofort.
  - interval: 1m
    input_series:
      - series: 'homepage_restore_test_success{instance="raspberry-pi", job="node"}'
        values: '1 0 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: RestoreTestFehlgeschlagen
        exp_alerts: []
      - eval_time: 2m
        alertname: RestoreTestFehlgeschlagen
        exp_alerts:
          - exp_labels: {severity: warning, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Restore-Test fehlgeschlagen"
              description: "Das neueste Backup ließ sich nicht prüfen oder zurückspielen. Logs: journalctl -u homepage-restore-test"

  # Restore-Test: letzter Erfolg bei t=0, Alarm erst nach über 8 Tagen.
  - interval: 1m
    input_series:
      - series: 'homepage_restore_test_last_success_timestamp_seconds{instance="raspberry-pi", job="node"}'
        values: '0x11700'
    alert_rule_test:
      - eval_time: 8d
        alertname: RestoreTestVeraltet
        exp_alerts: []
      - eval_time: 193h30m
        alertname: RestoreTestVeraltet
        exp_alerts:
          - exp_labels: {severity: warning, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Seit über 8 Tagen kein erfolgreicher Restore-Test"
              description: "Prüfen mit: systemctl list-timers homepage-restore-test.timer und journalctl -u homepage-restore-test (docs/backup.md)"

  # Platte: 81 % belegt, gerechnet wie df (belegt / (belegt + verfügbar)),
  # also ohne die 50 für root reservierten Blöcke: 810 / (810 + 190).
  # Warnung erst nach 10 Minuten, die kritische Stufe (90 %) noch nicht.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '1050x20'
      - series: 'node_filesystem_free_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '240x20'
      - series: 'node_filesystem_avail_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '190x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: PlatteFuellstandHoch
        exp_alerts: []
      - eval_time: 11m
        alertname: PlatteFuellstandHoch
        exp_alerts:
          - exp_labels: {severity: warning, device: /dev/sda1, fstype: ext4, mountpoint: /mnt/data, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Platte zu 81 % belegt"
              description: "Auf /mnt/data liegen die Daten des Cloud-Speichers und das Monitoring-Backup. Aufräumen oder eine größere Platte planen (Dashboard Cloud-Speicher, Prognose)."
      - eval_time: 11m
        alertname: PlatteFuellstandKritisch
        exp_alerts: []

  # Platte: 92 % belegt (920 / (920 + 80)). Kritisch nach 5 Minuten. Die
  # allgemeinen Speicherplatz-Alarme (85 %) melden diese Platte nicht noch einmal.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '1050x20'
      - series: 'node_filesystem_free_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '130x20'
      - series: 'node_filesystem_avail_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '80x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PlatteFuellstandKritisch
        exp_alerts: []
      - eval_time: 6m
        alertname: PlatteFuellstandKritisch
        exp_alerts:
          - exp_labels: {severity: critical, device: /dev/sda1, fstype: ext4, mountpoint: /mnt/data, instance: raspberry-pi, job: node}
            exp_annotations:
              summary: "Platte zu 92 % belegt"
              description: "Der Cloud-Speicher nimmt bald keine Uploads mehr an. Jetzt aufräumen oder auf eine größere Platte umziehen (docs/backup.md)."
      - eval_time: 15m
        alertname: SpeicherplatzKnapp
        exp_alerts: []

  # Platte nicht eingehängt: Der node-exporter läuft, meldet aber kein
  # Dateisystem unter /mnt/data. Alarm nach 5 Minuten.
  - interval: 1m
    input_series:
      - series: 'up{instance="raspberry-pi", job="node"}'
        values: '1x20'
      - series: 'node_filesystem_size_bytes{device="/dev/mmcblk0p2", fstype="ext4", mountpoint="/", instance="raspberry-pi", job="node"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PlatteNichtEingehaengt
        exp_alerts: []
      - eval_time: 6m
        alertname: PlatteNichtEingehaengt
        exp_alerts:
          - exp_labels: {severity: critical, mountpoint: /mnt/data}
            exp_annotations:
              summary: "Platte unter /mnt/data ist nicht eingehängt"
              description: "Backup und Cloud-Speicher haben kein Ziel. Prüfen mit: findmnt /mnt/data und journalctl -u mnt-data.mount"

  # Platte eingehängt: kein Alarm. Fällt der node-exporter aus, meldet das
  # ZielNichtErreichbar, nicht dieser Alarm.
  - interval: 1m
    input_series:
      - series: 'up{instance="raspberry-pi", job="node"}'
        values: '1x10 0x20'
      - series: 'node_filesystem_size_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '1000x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PlatteNichtEingehaengt
        exp_alerts: []
      - eval_time: 25m
        alertname: PlatteNichtEingehaengt
        exp_alerts: []

  # Platte: 79 % belegt (790 / (790 + 210)). Kein Alarm, auch nach 20 Minuten.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '1050x30'
      - series: 'node_filesystem_free_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '260x30'
      - series: 'node_filesystem_avail_bytes{device="/dev/sda1", fstype="ext4", mountpoint="/mnt/data", instance="raspberry-pi", job="node"}'
        values: '210x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: PlatteFuellstandHoch
        exp_alerts: []
