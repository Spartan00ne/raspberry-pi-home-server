global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: raspberry-pi

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # Host-Metriken: CPU, RAM, Temperatur, Dateisysteme, Netzwerk + Pi-Textfile
  - job_name: node
    static_configs:
      - targets: [host.docker.internal:9100]
    relabel_configs:
      - target_label: instance
        replacement: raspberry-pi

  # Container-Metriken
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  # Ende-zu-Ende-Prüfung: Ist die Website aus dem Internet erreichbar?
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://koffler-online.de/
          - https://koffler-online.de/api/health
          - https://koffler-online.de/monitoring/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
