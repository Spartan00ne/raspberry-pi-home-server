# WebSocket-Weiterleitung für Grafana Live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name koffler-online.de;

    root /usr/share/nginx/html;
    index index.html;


    # Homepage und statische Dateien
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }


    # Dashboard API
    location /api/ {
        proxy_pass http://dashboard-api:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }


    # Monitoring (Grafana): öffentlich nur lesend.
    # Anmeldung und Verwaltung nur lokal per SSH-Tunnel, siehe monitoring/README.md
    location = /monitoring {
        return 301 /monitoring/;
    }

    location ^~ /monitoring/login {
        return 404;
    }

    location ^~ /monitoring/ {
        # Docker-DNS zur Laufzeit auflösen: nginx startet auch, wenn Grafana nicht läuft
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }


    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }


    # Versteckte Dateien sperren
    location ~ /\. {
        deny all;
    }
}
