# CI für den Raspberry-Pi-Homeserver.
#
# Jeder Push und jeder Pull Request wird geprüft. Auf main wird zusätzlich das
# ARM64-Image der Dashboard-API gebaut, getestet und nach GHCR veröffentlicht.
# Ausgerollt wird nicht von hier aus: Der Pi holt sich neue Stände selbst
# (scripts/deploy), sobald dieser Workflow für den Commit erfolgreich war.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/spartan00ne/raspberry-pi-home-server/dashboard-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck (scripts/)
        run: shellcheck scripts/*

      # systemd startet die Skripte direkt; ohne Ausführungsrecht schlägt die
      # Unit mit 203/EXEC fehl, bevor das Skript eine Metrik schreiben kann.
      - name: Skripte sind ausführbar
        run: |
          rc=0
          for f in scripts/*; do
            [[ "$f" == *-lib ]] && continue
            mode=$(git ls-files -s "$f" | cut -c1-6)
            [[ "$mode" == 100755 ]] || { echo "::error file=$f::nicht ausführbar ($mode)"; rc=1; }
          done
          exit $rc

      - name: Ruff (Python-API)
        run: pipx run ruff==0.17.5 check --no-cache api

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Grafana-Dashboards sind gültiges JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok: $f"
          done

  validate:
    name: Konfiguration prüfen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Die Tools laufen in genau den Image-Versionen, die auch auf dem Pi laufen.
      # Quelle ist die jeweilige docker-compose.yml, damit nichts auseinanderläuft.
      - name: Image-Versionen aus Compose lesen
        run: |
          img() { awk -v n="$1:" '$1 == "image:" && index($2, n) == 1 { print $2; exit }' "$2"; }
          {
            echo "NGINX_IMAGE=$(img nginx docker-compose.yml)"
            echo "PROMETHEUS_IMAGE=$(img prom/prometheus monitoring/docker-compose.yml)"
            echo "ALERTMANAGER_IMAGE=$(img prom/alertmanager monitoring/docker-compose.yml)"
            echo "BLACKBOX_IMAGE=$(img prom/blackbox-exporter monitoring/docker-compose.yml)"
          } | tee -a "$GITHUB_ENV"

      - name: Docker Compose
        env:
          TUNNEL_TOKEN: ci-dummy
        run: |
          docker compose config --quiet
          # Secrets existieren nur auf dem Pi; für die Prüfung reichen leere Dateien.
          mkdir -p monitoring/secrets
          touch monitoring/secrets/{telegram_bot_token,telegram_chat_id,grafana_admin_password}
          docker compose -f monitoring/docker-compose.yml config --quiet

      - name: Prometheus-Konfiguration und Alarmregeln
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: Unit-Tests der Alarmregeln
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules /etc/prometheus/tests/alerts_test.yml

      - name: Alertmanager-Konfiguration
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml

      - name: Blackbox-Exporter-Konfiguration
        run: |
          docker run --rm -v "$PWD/monitoring/blackbox:/etc/blackbox:ro" \
            "$BLACKBOX_IMAGE" --config.file=/etc/blackbox/blackbox.yml --config.check

      - name: Nginx-Konfiguration
        run: |
          # Upstream-Namen gibt es nur im Docker-Netz auf dem Pi.
          docker run --rm --add-host dashboard-api:127.0.0.1 \
            -v "$PWD/nginx:/etc/nginx/conf.d:ro" "$NGINX_IMAGE" nginx -t

  ansible:
    name: Ansible (Lint + Testlauf)
    # Gleiche Architektur wie der Pi (arm64), damit z. B. das Docker-Repo stimmt.
    runs-on: ubuntu-24.04-arm
    env:
      ANSIBLE_CORE_VERSION: "2.21.6"
      ANSIBLE_LINT_VERSION: "26.11.0"
      ANSIBLE_FORCE_COLOR: "1"
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v5

      - name: Vault-Dateien sind verschlüsselt
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            head -1 "$f" | grep -q '^\$ANSIBLE_VAULT;' || { echo "::error file=ansible/$f::Nicht verschlüsselt"; exit 1; }
            echo "ok: $f"
          done < <(git ls-files 'inventory/**vault*.yml')
          [ "$found" = 1 ] || { echo "::error::Keine Vault-Datei gefunden"; exit 1; }

      - name: Ansible installieren (gepinnt)
        run: |
          pipx install "ansible-core==${ANSIBLE_CORE_VERSION}"
          pipx inject --include-apps ansible-core "ansible-lint==${ANSIBLE_LINT_VERSION}"
          ansible-galaxy collection install -r requirements.yml
          # Die CI bekommt das echte Vault-Passwort nie; das Test-Inventar braucht keins.
          echo "ci-has-no-vault-password" > "$RUNNER_TEMP/vault-pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault-pass" >> "$GITHUB_ENV"

      - name: ansible-lint (Profil production)
        run: ansible-lint --profile production

      - name: Syntax-Check
        run: |
          ansible-playbook -i tests/inventory --syntax-check site.yml
          ansible-playbook -i tests/inventory --syntax-check upgrade.yml
          ansible-playbook -i tests/inventory --syntax-check restore.yml

      - name: Testcontainer starten (Debian trixie mit systemd)
        run: |
          docker build -t pi-test tests
          # Eigene Volumes für Docker-in-Docker: overlayfs auf overlayfs geht nicht.
          docker run -d --name pi-test --hostname pi-test --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v pi-test-docker:/var/lib/docker -v pi-test-containerd:/var/lib/containerd \
            --tmpfs /run --tmpfs /run/lock pi-test
          for _ in $(seq 30); do
            state=$(docker exec pi-test systemctl is-system-running 2>/dev/null || true)
            [[ "$state" == running || "$state" == degraded ]] && break
            sleep 1
          done
          echo "systemd: $state"

      # boot (cmdline.txt) und firewall (ufw) gibt es im Container nicht sinnvoll.
      - name: Erster Lauf
        run: ansible-playbook -i tests/inventory site.yml --skip-tags boot,firewall

      - name: Zweiter Lauf muss idempotent sein (changed=0)
        run: |
          set -o pipefail
          ansible-playbook -i tests/inventory site.yml --skip-tags boot,firewall | tee "$RUNNER_TEMP/second.log"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/second.log" \
            | grep -qE '^pi-test +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0' \
            || { echo "::error::Zweiter Lauf hat noch etwas geändert (nicht idempotent)"; exit 1; }

      - name: Container-Logs bei Fehler
        if: failure()
        working-directory: .
        run: docker exec pi-test journalctl --no-pager -n 100 || true

  image:
    name: Image bauen (arm64)
    needs: [lint, validate]
    # Nativer ARM64-Runner: gleiche Architektur wie der Pi, kein QEMU nötig.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - name: Bauen
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          load: true
          tags: dashboard-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test
        run: |
          docker run -d --name api -p 8080:8080 dashboard-api:test
          curl -fsS --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/status | python3 -m json.tool > /dev/null
          echo "API antwortet."

      - name: Logs bei Fehler
        if: failure()
        run: docker logs api || true

      - name: Bei GHCR anmelden
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Veröffentlichen
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
