# Docker aus dem offiziellen Repository von Docker (nicht docker.io aus Debian).
#
# Der Admin-Benutzer kommt bewusst NICHT in die Gruppe docker: Mitglied dort
# zu sein entspricht Root-Rechten ohne Passwort-Nachfrage im Log. Skripte und
# Deployment rufen Docker deshalb mit sudo auf.
- name: Verzeichnis für APT-Schlüssel
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: GPG-Schlüssel von Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    # Gepinnt: Ein ausgetauschter Schlüssel fällt auf, statt still vertraut zu werden.
    checksum: "sha256:{{ docker_gpg_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Docker-Repository eintragen
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  notify: Paketlisten aktualisieren

- name: Neues Repository vor der Installation einlesen
  ansible.builtin.meta: flush_handlers

- name: Docker installieren
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Docker läuft
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: "{{ 'started' if docker_start_service else omit }}"
