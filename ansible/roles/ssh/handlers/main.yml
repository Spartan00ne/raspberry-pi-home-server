# Gesamte Konfiguration (inkl. aller Drop-ins) prüfen, erst dann neu laden.
# Nur reload, nie restart: Bestehende Sitzungen bleiben erhalten.
- name: Sshd prüfen und neu laden
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: true
  notify: Sshd neu laden

- name: Sshd neu laden
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
