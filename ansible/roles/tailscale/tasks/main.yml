# Tailscale aus dem offiziellen Repository, Anmeldung im Tailnet.
#
# Der Pi übernimmt nicht die DNS-Auflösung von Tailscale (--accept-dns=false)
# und keine Routen anderer Geräte (--accept-routes=false). So bleiben DNS und
# der Weg ins LAN unverändert. Wer was im Tailnet erreicht, regelt die
# ACL-Policy in tailscale/policy.hujson, nicht ufw (docs/tailscale.md).
#
# Die Anmeldung trägt das Tag "tailnet". Die CI überspringt sie, weil der
# Testcontainer keinen Auth-Key hat und nicht ins Tailnet soll.

- name: Verzeichnis für APT-Schlüssel
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: GPG-Schlüssel von Tailscale
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
    dest: /etc/apt/keyrings/tailscale.gpg
    # Gepinnt: Ein ausgetauschter Schlüssel fällt auf, statt still vertraut zu werden.
    checksum: "sha256:{{ tailscale_gpg_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Tailscale-Repository eintragen
  ansible.builtin.template:
    src: tailscale.sources.j2
    dest: /etc/apt/sources.list.d/tailscale.sources
    owner: root
    group: root
    mode: "0644"
  notify: Paketlisten aktualisieren

- name: Neues Repository vor der Installation einlesen
  ansible.builtin.meta: flush_handlers

- name: Tailscale installieren
  ansible.builtin.apt:
    name: tailscale
    state: present
  register: tailscale_install

# Im Check-Modus vor der ersten Installation gibt es weder Unit noch Befehl.
- name: Tailscaled läuft
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when: not (ansible_check_mode and tailscale_install is changed)

- name: Im Tailnet anmelden
  tags: [tailnet]
  when: not (ansible_check_mode and tailscale_install is changed)
  block:
    - name: Status lesen
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_before
      changed_when: false
      check_mode: false

    # Wie bei der Firewall: Erst ein Rettungs-Timer, dann die Änderung, dann
    # eine NEUE SSH-Verbindung über das LAN. Klappt sie nicht, bleibt der
    # Timer aktiv und meldet den Pi wieder ab.
    - name: Anmelden (mit Rettungs-Timer)
      when:
        - (tailscale_status_before.stdout | from_json).BackendState != 'Running'
        - not ansible_check_mode
      block:
        - name: Auth-Key muss gesetzt sein
          ansible.builtin.assert:
            that: tailscale_auth_key is defined and tailscale_auth_key | length > 0
            fail_msg: "vault_tailscale_auth_key fehlt im Vault (docs/tailscale.md#einrichten)"
            quiet: true

        - name: Eindeutigen Namen für den Rettungs-Timer festlegen
          ansible.builtin.set_fact:
            tailscale_rescue_unit: "tailscale-rescue-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"

        - name: Rettungs-Timer starten
          ansible.builtin.command: >-
            systemd-run --on-active={{ tailscale_rescue_minutes }}min
            --unit={{ tailscale_rescue_unit }} /usr/bin/tailscale down
          changed_when: true

        - name: Mit Auth-Key anmelden
          ansible.builtin.command: >-
            tailscale up --auth-key={{ tailscale_auth_key }}
            --advertise-tags={{ tailscale_tags | join(',') }}
            --accept-dns=false --accept-routes=false --timeout=60s
          changed_when: true
          no_log: true

        # Bewusst ohne SSH-Multiplexing: Eine bestehende Verbindung würde
        # eine neue Sperre nicht bemerken.
        - name: Neue SSH-Verbindung testen
          ansible.builtin.command: >-
            ssh -o BatchMode=yes -o ControlMaster=no -o ControlPath=none
            -o ConnectTimeout=10 -i {{ ansible_ssh_private_key_file }}
            {{ ansible_user }}@{{ ansible_host }} true
          delegate_to: localhost
          become: false
          register: tailscale_ssh_test
          retries: 3
          delay: 5
          until: tailscale_ssh_test.rc == 0
          changed_when: false
          when: ansible_connection | default('ssh') in ['ssh', 'smart']

        - name: Rettungs-Timer stoppen
          ansible.builtin.systemd_service:
            name: "{{ tailscale_rescue_unit }}.timer"
            state: stopped

    - name: Einstellungen lesen
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs_raw
      changed_when: false
      check_mode: false

    - name: Status nach der Anmeldung lesen
      ansible.builtin.command: tailscale status --json
      register: tailscale_status_after
      changed_when: false
      check_mode: false

    - name: Gelesene Werte merken
      ansible.builtin.set_fact:
        tailscale_prefs: "{{ tailscale_prefs_raw.stdout | from_json }}"
        tailscale_state: "{{ tailscale_status_after.stdout | from_json }}"

    # Driftkorrektur, etwa nach einem "tailscale up" von Hand.
    - name: DNS und Routen von Tailscale nicht übernehmen
      ansible.builtin.command: tailscale set --accept-dns=false --accept-routes=false
      when: tailscale_prefs.CorpDNS or tailscale_prefs.RouteAll
      changed_when: true

    # Im Check-Modus vor der ersten Anmeldung gibt es noch nichts zu prüfen.
    - name: Pi ist getaggt im Tailnet, ohne Ablauf des Schlüssels
      ansible.builtin.assert:
        that:
          - tailscale_state.BackendState == 'Running'
          - tailscale_tags is subset(tailscale_state.Self.Tags | default([]))
          - tailscale_state.Self.KeyExpiry is not defined
        fail_msg: >-
          Status {{ tailscale_state.BackendState }}, Tags
          {{ tailscale_state.Self.Tags | default([]) }}, Ablauf
          {{ tailscale_state.Self.KeyExpiry | default('keiner') }}.
          Erwartet: Running, {{ tailscale_tags }}, kein Ablauf.
        quiet: true
      when: not (ansible_check_mode and tailscale_state.BackendState != 'Running')
