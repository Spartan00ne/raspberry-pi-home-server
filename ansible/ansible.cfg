# Ansible-Konfiguration für den Raspberry-Pi-Homeserver.
# Aufruf immer aus diesem Verzeichnis (ansible/), siehe docs/ansible.md.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Das Vault-Passwort liegt nur auf dem Controller, nie im Repo.
vault_password_file = ~/.ansible/vault-pass
interpreter_python = auto_silent
callback_result_format = yaml
# Fakten werden in jedem Lauf frisch gesammelt; der Pi ist der einzige Host.
gathering = smart

[ssh_connection]
pipelining = True
