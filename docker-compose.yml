services:
  nginx-homepage:
    image: nginx:1.31.3
    container_name: nginx-homepage
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # Verzeichnis statt Einzeldatei: Git ersetzt Dateien beim Update, ein
      # Einzeldatei-Mount würde weiter auf die alte Version zeigen.
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - web

  dashboard-api:
    # Image baut die CI (GitHub Actions) für ARM64; scripts/deploy setzt API_TAG
    # auf den ausgerollten Commit. "build" bleibt für lokale Entwicklung.
    image: ghcr.io/spartan00ne/raspberry-pi-home-server/dashboard-api:${API_TAG:-main}
    build:
      context: ./api
    container_name: dashboard-api
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      web:
        aliases:
          - dashboard-api
    volumes:
      - /sys/class/thermal:/sys/class/thermal:ro
      - /:/host:ro
      - /mnt/external_drive:/mnt/external_drive:ro
      - ./runtime:/runtime:ro

networks:
  web:
